name: Build SUPER16 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android
        uses: android-actions/setup-android@v3

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila SUPER16
        run: |
          if [ -f settings.gradle ]; then
            DIR="."
          elif [ -f SUPER16-Android/settings.gradle ]; then
            DIR="SUPER16-Android"
          else
            echo "Progetto Android non trovato"
            exit 1
          fi
          cd "$DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/SUPER16.apk"

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: SUPER16-APK
          path: output/SUPER16.apk
